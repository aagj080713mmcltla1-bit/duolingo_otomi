<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Otomi - Estilo Duolingo</title>
    <style>
        /* Importamos una fuente redondeada similar a la de Duolingo */
        @import url('https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&display=swap');

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Nunito', sans-serif;
            background-color: #ffffff;
            color: #4b4b4b;
        }

        /* --- MENÚ LATERAL (SIDEBAR) --- */
        #menu-lateral {
            position: fixed;
            top: 0;
            left: 0;
            width: 260px;
            height: 100vh;
            background-color: #ffffff;
            border-right: 2px solid #e5e5e5;
            padding: 25px 16px;
            display: flex;
            flex-direction: column;
            overflow-y: auto;
        }

        /* Títulos de las secciones ("Otomi" y "Bienvenido") */
        #menu-lateral label {
            font-size: 1.5rem;
            font-weight: 900;
            color: #58cc02; /* Verde icónico de Duolingo */
            letter-spacing: 0.5px;
            margin-bottom: 15px;
            padding-left: 12px;
            display: block;
        }

        /* Separación entre el primer y segundo bloque de menú */
        #menu-lateral label:nth-of-type(2) {
            margin-top: 25px;
            padding-top: 20px;
            border-top: 2px solid #e5e5e5;
            font-size: 1.1rem;
            color: #afafaf;
            text-transform: uppercase;
        }

        /* Lista de navegación */
        .container-Menu ul {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        /* Enlaces (Botones del menú) */
        .container-Menu ul li a {
            display: flex;
            align-items: center;
            text-decoration: none;
            color: #777777;
            font-weight: 800;
            font-size: 0.95rem;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            padding: 12px 16px;
            border-radius: 12px;
            border: 2px solid transparent;
            transition: all 0.15s ease;
        }

        /* Efecto al pasar el mouse (Hover) */
        .container-Menu ul li a:hover {
            background-color: #f7f7f7;
            color: #4b4b4b;
        }

        /* Estilo destacado para el primer botón ("APRENDER") como sección activa */
        .container-Menu:first-of-type ul li:first-child a {
            background-color: #ddf4ff;
            color: #1cb0f6; /* Azul activo de Duolingo */
            border: 2px solid #84d8ff;
        }

        /* --- CONTENIDO PRINCIPAL --- */
        .main-content {
            margin-left: 260px; 
            padding: 40px;
            min-height: 100vh;
        }

        .main-content h1 {
            font-size: 2.2rem;
            font-weight: 900;
            color: #3c3c3c;
            margin-bottom: 8px;
        }

        .main-content h3 {
            font-size: 1.2rem;
            font-weight: 700;
            color: #777777;
        }

        /* --- RESPONSIVO (Para celulares) --- */
        @media (max-width: 768px) {
            #menu-lateral {
                width: 100%;
                height: auto;
                position: relative;
                border-right: none;
                border-bottom: 2px solid #e5e5e5;
            }

            .main-content {
                margin-left: 0;
                padding: 20px;
            }
        }
    </style>
</head>
<body>

    <main class="main-content">
        <h1>Bienvenido</h1>
        <h3>Menu principal</h3>
    </main>

    <div id="menu-lateral">
        <label>Dulingo Otomi</label>
        <nav class="container-Menu">
        <label>Bienvenido</label>
        <nav class="container-Menu">

            <ul>
                <li><a href="login.html">Inicio</a></li>
                <li><a href="perfil.html">Perfil</a></li>
                <li><a href="unidad_animales.html">APRENDER</a></li>
                <li><a href="unidad_animales.html">Lecciones</a></li>
                <li><a href="juegos.html">Juegos</a></li>
            </ul>
        </nav>

    </div>

</body>
</html>
